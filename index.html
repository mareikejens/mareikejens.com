<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<!-- Holding page: keep the site out of search results while it's paused. -->
<meta name="robots" content="noindex" />
<title>Mareike Jens</title>
<meta name="description" content="Mareike Jens, Zürich. Building something new." />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="me" href="https://mareikejens.substack.com/" />
<link rel="me" href="https://www.linkedin.com/in/mareike-jens/" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --accent:#FF5B1F; --bg:#F5F1EA; --ink:#0E0E0C; --ink-2:#2a2622; --muted:#736a60; }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0E0E0C; --ink:#F5F1EA; --ink-2:#d9d2c7; --muted:#9a9187; }
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;}
  body{
    display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--ink);
    font-family:'Inter Tight', system-ui, sans-serif; -webkit-font-smoothing:antialiased;
    padding:0 24px;
  }
  main{max-width:560px;}
  .name{font-size:13px; font-weight:500; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin:0 0 20px;}
  h1{font-family:'Instrument Serif', serif; font-weight:400; font-size:clamp(44px, 8vw, 72px); line-height:1; letter-spacing:-.02em; margin:0 0 28px;}
  h1 em{color:var(--accent);}
  p{font-size:18px; line-height:1.6; color:var(--ink-2); margin:0 0 12px;}
  a{color:inherit; text-decoration-color:var(--accent); text-underline-offset:3px;}
  a:hover{color:var(--accent);}
</style>
</head>
<body>
<main>
  <p class="name">Mareike Jens</p>
  <h1>Building something <em>new</em>.</h1>
  <p>I write about AI, without AI, on <a href="https://mareikejens.substack.com/">Substack</a>.</p>
  <p>Say hi at <a href="mailto:mareike.jens@gmail.com">mareike.jens@gmail.com</a> or on <a href="https://www.linkedin.com/in/mareike-jens/">LinkedIn</a>.</p>
</main>
</body>
</html>
